[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-safety-evaluation-toolkit"
version = "0.1.0"
description = "A toolkit for evaluating LLM safety responses."
readme = "README.md"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "mypy>=1.0",
    "black>=25.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

